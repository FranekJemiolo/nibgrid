name: Desktop Release Pipeline (Nibgrid Studio)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run smoke:desktop
      - run: VITE_BASE_PATH=./ npm run build

  package-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-dmg
          - os: windows-latest
            target: windows-exe
          - os: ubuntu-latest
            target: linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: VITE_BASE_PATH=./ npm run build
      - name: Stage Nibgrid Studio desktop bundle
        run: node --experimental-strip-types desktop/scripts/build-desktop.ts --stage-dir desktop/stage
      - name: Verify staged desktop bundle
        run: node --experimental-strip-types desktop/scripts/smoke-desktop-bundle.ts --stage-dir desktop/stage
      - name: Upload staged desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nibgrid-studio-${{ matrix.target }}
          path: desktop/stage
